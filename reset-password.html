
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تغيير كلمة المرور - مطعم تميم</title>
    <link rel="stylesheet" href="admin.css">
</head>
<body>
    <main class="container">
        <header class="page-header">
            <h1>مطعم تميم</h1>
            <p>استعادة كلمة المرور</p>
        </header>

        <section class="panel">
            <h2>اختار كلمة مرور جديدة</h2>

            <form id="reset-form">
                <label for="new-password">كلمة المرور الجديدة</label>
                <input
                    id="new-password"
                    type="password"
                    minlength="8"
                    autocomplete="new-password"
                    required
                >

                <label for="confirm-password">تأكيد كلمة المرور</label>
                <input
                    id="confirm-password"
                    type="password"
                    minlength="8"
                    autocomplete="new-password"
                    required
                >

                <button type="submit" id="reset-button">
                    حفظ كلمة المرور
                </button>
            </form>

            <p id="reset-message" role="status" aria-live="polite"></p>

            <a class="back-link" href="admin.html">
                العودة لتسجيل دخول المدير
            </a>
        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="reset-password.js"></script>
</body>
</html>
