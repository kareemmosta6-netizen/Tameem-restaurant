
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تغيير كلمة المرور - مطعم تميم</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #fff7ec;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 16px;
            box-sizing: border-box;
        }
        .card {
            background: white;
            width: 100%;
            max-width: 380px;
            padding: 25px;
            border-radius: 14px;
            box-shadow: 0 4px 20px #00000015;
            box-sizing: border-box;
        }
        h1 { color: #c91d24; font-size: 24px; }
        input, button {
            width: 100%;
            padding: 12px;
            margin-top: 12px;
            box-sizing: border-box;
            border-radius: 8px;
            font-size: 16px;
        }
        input { border: 1px solid #ccc; }
        button {
            background: #c91d24;
            color: white;
            border: none;
            cursor: pointer;
        }
        #message { margin-top: 15px; line-height: 1.7; }
    </style>
</head>
<body>
    <main class="card">
        <h1>تغيير كلمة المرور</h1>
        <p>اكتب كلمة المرور الجديدة لحساب مدير مطعم تميم.</p>

        <form id="reset-form">
            <input
                id="new-password"
                type="password"
                placeholder="كلمة المرور الجديدة"
                minlength="8"
                autocomplete="new-password"
                required
            >
            <input
                id="confirm-password"
                type="password"
                placeholder="تأكيد كلمة المرور"
                minlength="8"
                autocomplete="new-password"
                required
            >
            <button type="submit">حفظ كلمة المرور</button>
        </form>

        <p id="message" role="status"></p>
        <a href="admin.html">العودة لتسجيل دخول المدير</a>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="reset-password.js"></script>
</body>
</html>
